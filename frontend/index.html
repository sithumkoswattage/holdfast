<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holdfast // Tactical Command Engine</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-left">
            <span class="status-dot"></span>
            <h2>HOLDFAST // THEATER COMMAND</h2>
        </div>
        <div class="header-right">
            <button id="editor-toggle-btn" class="editor-btn">ENTER LOGGER MODE</button>
        </div>
    </header>

    <div id="app-container">
        <!-- Sidebar Controls -->
        <div id="sidebar">
            <div class="panel-section">
                <h3>THEATER SELECTION</h3>
                <select id="campaign-select">
                    <option value="">-- Select Active Campaign --</option>
                </select>
                <button id="load-campaign-btn">ENGAGE OPERATIONS</button>
            </div>

            <!-- Unit Waypoint Logger Panel -->
            <div class="panel-section" id="editor-panel" style="display: none; border-color: #ca8a04;">
                <h3 style="color: #facc15;">WAYPOINT LOGGER</h3>
                
                <label class="input-label">SELECT UNIT</label>
                <select id="logger-unit-select">
                    <option value="NEW">+ Register New Unit</option>
                </select>

                <!-- New Unit Fields (shown when + Register New Unit is selected) -->
                <div id="new-unit-fields">
                    <label class="input-label">UNIT DESIGNATION</label>
                    <input type="text" id="new-unit-name" placeholder="e.g., 101st Airborne">

                    <div style="display: flex; gap: 6px; margin-top: 6px;">
                        <div style="flex: 1;">
                            <label class="input-label">FACTION</label>
                            <select id="new-unit-faction">
                                <option value="Attacker">Attacker</option>
                                <option value="Defender">Defender</option>
                                <option value="Neutral">Neutral</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label class="input-label">TYPE</label>
                            <select id="new-unit-type">
                                <option value="Airborne">Airborne</option>
                                <option value="Infantry">Infantry</option>
                                <option value="Armor">Armor</option>
                                <option value="Artillery">Artillery</option>
                                <option value="Headquarters">HQ</option>
                            </select>
                        </div>
                    </div>
                </div>

                <hr style="border: 1px solid #232d27; margin: 12px 0;">

                <h3 style="color: #facc15;">WAYPOINT DATA</h3>
                <label class="input-label">DATE & TIME (HISTORICAL)</label>
                <input type="datetime-local" id="waypoint-timestamp">

                <div style="display: flex; gap: 6px; margin-top: 6px;">
                    <div style="flex: 1;">
                        <label class="input-label">STRENGTH</label>
                        <input type="number" id="waypoint-strength" value="5000" min="0">
                    </div>
                    <div style="flex: 1;">
                        <label class="input-label">AMMO</label>
                        <select id="waypoint-ammo">
                            <option value="Full">Full</option>
                            <option value="Operational" selected>Operational</option>
                            <option value="Critical">Critical</option>
                            <option value="Depleted">Depleted</option>
                        </select>
                    </div>
                </div>

                <label class="input-label" style="margin-top: 6px;">HISTORICAL NOTES / ORDERS</label>
                <textarea id="waypoint-notes" rows="3" placeholder="e.g., Securing bridge crossroad..."></textarea>

                <div id="click-status" class="status-box">CLICK MAP TO SET LOCATION</div>

                <button id="save-waypoint-btn" style="width: 100%; margin-top: 10px; background-color: #ca8a04; color: #000; border-color: #a16207;">RECORD WAYPOINT</button>
            </div>

            <div class="panel-section" id="intel-panel">
                <h3>THEATER INTEL</h3>
                <h4 id="active-campaign-title">No Campaign Loaded</h4>
                <p id="active-campaign-desc" style="font-size: 11px; color: #8c9e93; line-height: 1.4; margin-top: 4px;">Select an operational theater above to begin.</p>
                <div class="unit-counters" style="margin-top: 10px;">
                    <div class="stat-pill attacker">ACTIVE UNITS: <span id="total-units-count">0</span></div>
                </div>
            </div>

            <div class="panel-section">
                <h3>TARGET ACQUISITION</h3>
                <div class="search-box">
                    <input type="text" id="location-input" placeholder="e.g., Bastogne, Belgium">
                    <button id="search-btn">FLY TO</button>
                </div>
            </div>
        </div>

        <!-- Live Canvas & Tactical Bottom Bar -->
        <div id="map-wrapper">
            <div id="map-canvas"></div>

            <!-- Bottom Chronological Deck -->
            <div id="playback-deck">
                <div class="deck-info">
                    <span class="deck-label">TEMPORAL SCRUBBER</span>
                    <span id="deck-timestamp">--:--:--</span>
                </div>

                <div class="slider-container">
                    <input type="range" id="timeline-slider" min="0" max="1000" value="0" step="1" disabled>
                </div>

                <div class="deck-controls">
                    <button id="prev-btn" title="Step Back">&#9664;&#9664;</button>
                    <button id="play-btn" title="Auto Play / Pause">&#9654; PLAY</button>
                    <button id="next-btn" title="Step Forward">&#9654;&#9654;</button>
                    
                    <div class="speed-selector">
                        <label>RATE:</label>
                        <select id="playback-speed">
                            <option value="60000">1 Min / Sec</option>
                            <option value="3600000">1 Hour / Sec</option>
                            <option value="21600000" selected>6 Hours / Sec</option>
                            <option value="86400000">1 Day / Sec</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
